name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: X-Whisper version
      placeholder: "e.g. 1.0.0 — see Settings → About"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: GPU / hardware tier
      description: Shown under Settings → About (e.g. "RTX 3060 (12GB), tier High" or "CPU only").

  - type: input
    id: model
    attributes:
      label: Model in use
      placeholder: "e.g. X-Turbo, X-Small EN, X-Turbo Cloud"

  - type: textarea
    id: logs
    attributes:
      label: Engine log
      description: |
        Tail of `engine.log` — `%APPDATA%\X-Whisper\logs\` on Windows, `~/Library/Application Support/X-Whisper/logs/` on macOS. Strip anything personal.
      render: text
